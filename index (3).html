<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRE Verbal — Vocabulary Trainer</title>
<style>
  :root{
    --ink:#1a1a2e; --paper:#f5f1e8; --card:#fffdf7; --line:#d9cfbb;
    --accent:#6d4aff; --accent2:#00b3a4;
    --pos:#1f9d55; --pos-bg:#e6f6ec; --pos-line:#a9dcbc;
    --neg:#c23b52; --neg-bg:#fbe9ec; --neg-line:#eeb6c1;
    --neu:#8a6d3b; --neu-bg:#f3ecdd; --neu-line:#ddcba3;
    --muted:#6b6456;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    background:var(--paper); color:var(--ink); line-height:1.5; padding:0 0 90px;
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  header{padding:26px 16px 18px;text-align:center;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#efe8d8,#f5f1e8)}
  .eyebrow{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.1}
  .sub{color:var(--muted);font-size:14px}
  .counts{margin-top:10px;font-size:12.5px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .counts b{color:var(--ink)}

  .controls{position:sticky;top:0;z-index:20;background:rgba(245,241,232,.94);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px}
  .searchrow{display:flex;gap:8px;align-items:center;max-width:960px;margin:0 auto}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);
    border:1.5px solid var(--line);border-radius:11px;padding:9px 12px}
  .search:focus-within{border-color:var(--accent)}
  .search input{border:0;outline:0;background:transparent;font-size:16px;width:100%;
    font-family:inherit;color:var(--ink)}
  .search svg{flex:none;opacity:.5}
  .mode{display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:11px;
    overflow:hidden;flex:none}
  .mode button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;
    padding:9px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
  .mode button.on{background:var(--accent);color:#fff}

  .filters{max-width:960px;margin:10px auto 0;display:flex;flex-direction:column;gap:8px}
  .filtergroup{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .filtergroup::-webkit-scrollbar{height:0}
  .chip{flex:none;border:1.4px solid var(--line);background:var(--card);border-radius:999px;
    padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted);
    font-family:inherit;white-space:nowrap;transition:.12s}
  .chip:active{transform:scale(.96)}
  .chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip.tone-positive.on{background:var(--pos);border-color:var(--pos)}
  .chip.tone-negative.on{background:var(--neg);border-color:var(--neg)}
  .chip.tone-neutral.on{background:var(--neu);border-color:var(--neu)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot.p{background:var(--pos)}.dot.n{background:var(--neg)}.dot.u{background:var(--neu)}

  main{padding-top:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    border-left:5px solid var(--neu);overflow:hidden;position:relative}
  .card.positive{border-left-color:var(--pos)}
  .card.negative{border-left-color:var(--neg)}
  .card-in{padding:15px 16px 16px}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .word{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .pos{font-size:11px;font-style:italic;color:var(--muted)}
  .tone-tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 8px;border-radius:999px;flex:none}
  .tone-tag.positive{color:var(--pos);background:var(--pos-bg);border:1px solid var(--pos-line)}
  .tone-tag.negative{color:var(--neg);background:var(--neg-bg);border:1px solid var(--neg-line)}
  .tone-tag.neutral{color:var(--neu);background:var(--neu-bg);border:1px solid var(--neu-line)}
  .def{margin-top:9px;font-size:15px}
  .ex{margin-top:9px;font-size:13.5px;font-style:italic;color:#4a4636;
    border-left:2px solid var(--line);padding-left:10px}
  .synrow{margin-top:11px;font-size:12.5px}
  .synrow .lbl{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:12px;padding:3px 9px;border-radius:7px;background:#efe9db;color:#4a4636}
  .tag.ant{background:#f3e6e6;color:#7a4048}
  .grp{margin-top:11px;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;
    color:var(--muted);letter-spacing:.04em}

  /* ===== Recall grid (tap-to-flip tiles) ===== */
  .grid.flip .card{cursor:pointer;min-height:150px;perspective:1000px;background:transparent;
    border:0;border-left:0}
  .flip-inner{position:relative;width:100%;height:100%;min-height:150px;transition:transform .5s;
    transform-style:preserve-3d}
  .card.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:14px;border:1px solid var(--line);background:var(--card);
    border-left:5px solid var(--neu);display:flex;align-items:center;justify-content:center;
    flex-direction:column;padding:18px;text-align:center}
  .card.positive .face{border-left-color:var(--pos)}
  .card.negative .face{border-left-color:var(--neg)}
  .face.front .word{font-size:26px}
  .face.front .hint{margin-top:8px;font-size:11px;color:var(--muted);
    font-family:ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase}
  .face.back{transform:rotateY(180deg);align-items:flex-start;justify-content:flex-start;
    text-align:left;overflow-y:auto}

  /* ===== FLASHCARD MODE ===== */
  #fcWrap{max-width:620px;margin:0 auto}
  .fc-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .fc-progress{flex:1;height:7px;background:#e4dcc9;border-radius:999px;overflow:hidden}
  .fc-progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .fc-count{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);
    font-weight:700;flex:none}
  .fc-shuffle{flex:none;border:1.4px solid var(--line);background:var(--card);border-radius:9px;
    padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);
    font-family:inherit;display:flex;align-items:center;gap:5px}
  .fc-shuffle:hover{border-color:var(--accent);color:var(--accent)}

  .fc-scores{display:flex;gap:8px;justify-content:center;margin-bottom:14px;
    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:700}
  .fc-scores span{padding:4px 11px;border-radius:999px;border:1px solid var(--line)}
  .fc-scores .know{color:var(--pos);background:var(--pos-bg);border-color:var(--pos-line)}
  .fc-scores .dunno{color:var(--neg);background:var(--neg-bg);border-color:var(--neg-line)}

  .fc-card{perspective:1400px;cursor:pointer;margin-bottom:16px;-webkit-tap-highlight-color:transparent}
  .fc-inner{position:relative;width:100%;min-height:340px;transition:transform .55s cubic-bezier(.4,0,.2,1);
    transform-style:preserve-3d}
  .fc-card.flipped .fc-inner{transform:rotateY(180deg)}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:18px;border:1px solid var(--line);background:var(--card);
    border-left:6px solid var(--neu);box-shadow:0 3px 14px rgba(26,26,46,.07);
    padding:26px;display:flex;flex-direction:column;overflow-y:auto}
  .fc-card.positive .fc-face{border-left-color:var(--pos)}
  .fc-card.negative .fc-face{border-left-color:var(--neg)}
  .fc-front{align-items:center;justify-content:center;text-align:center}
  .fc-front .fc-word{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .fc-front .fc-pos{margin-top:6px;font-size:13px;font-style:italic;color:var(--muted)}
  .fc-front .fc-hint{margin-top:20px;font-size:11px;color:var(--muted);
    font-family:ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
  .fc-back{transform:rotateY(180deg)}
  .fc-back .fc-word{font-size:25px;font-weight:800}
  .fc-back .fc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    padding-bottom:11px;border-bottom:1px solid var(--line)}

  .fc-actions{display:flex;gap:10px}
  .fc-actions button{flex:1;border:1.6px solid var(--line);background:var(--card);border-radius:12px;
    padding:13px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.12s}
  .fc-actions button:active{transform:scale(.97)}
  .fc-actions .again{color:var(--neg);border-color:var(--neg-line);background:var(--neg-bg)}
  .fc-actions .again:hover{background:var(--neg);color:#fff;border-color:var(--neg)}
  .fc-actions .got{color:var(--pos);border-color:var(--pos-line);background:var(--pos-bg)}
  .fc-actions .got:hover{background:var(--pos);color:#fff;border-color:var(--pos)}
  .fc-nav{display:flex;gap:10px;margin-top:10px}
  .fc-nav button{flex:1;border:1.4px solid var(--line);background:transparent;border-radius:10px;
    padding:9px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--muted)}
  .fc-nav button:hover{border-color:var(--ink);color:var(--ink)}
  .fc-nav button:disabled{opacity:.35;cursor:default}

  /* Session complete */
  .fc-done{text-align:center;padding:44px 24px;background:var(--card);border:1px solid var(--line);
    border-radius:18px}
  .fc-done h2{font-size:26px;margin-bottom:6px}
  .fc-done p{color:var(--muted);font-size:14.5px;margin-bottom:6px}
  .fc-done .stat{font-family:ui-monospace,Menlo,monospace;font-size:34px;font-weight:800;
    color:var(--accent);margin:16px 0 4px}
  .fc-done .btns{display:flex;gap:10px;margin-top:22px;justify-content:center;flex-wrap:wrap}
  .fc-done button{border:1.6px solid var(--accent);background:var(--accent);color:#fff;
    border-radius:11px;padding:11px 20px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .fc-done button.alt{background:transparent;color:var(--accent)}
  .fc-done button.alt:disabled{opacity:.35;cursor:default;border-color:var(--line);color:var(--muted)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty svg{opacity:.3;margin-bottom:12px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;padding:22px 16px;
    font-family:ui-monospace,Menlo,monospace}

  @media(max-width:520px){
    h1{font-size:25px}
    .grid{grid-template-columns:1fr}
    .mode button{padding:9px 9px;font-size:11.5px}
    .fc-front .fc-word{font-size:32px}
    .fc-inner{min-height:320px}
    .fc-face{padding:20px}
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">GRE Revised General Test · Verbal</div>
  <h1>Vocabulary Trainer</h1>
  <div class="sub">Definitions, tone, synonyms &amp; antonyms — from your scanned word lists</div>
  <div class="counts" id="counts"></div>
</header>

<div class="controls">
  <div class="searchrow">
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search word, meaning, or synonym…" autocomplete="off">
    </div>
    <div class="mode">
      <button id="mBrowse" class="on">Browse</button>
      <button id="mFlip">Recall</button>
      <button id="mCards">Flashcards</button>
    </div>
  </div>
  <div class="filters">
    <div class="filtergroup" id="tones"></div>
    <div class="filtergroup" id="groups"></div>
  </div>
</div>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <div id="fcWrap" style="display:none"></div>
  <div class="empty" id="empty" style="display:none">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <div>No words match your filters.</div>
  </div>
</main>

<footer id="foot"></footer>

sant"]},{"w":"abide","p":"verb","d":"To tolerate; to obey.","t":"neutral","g":"Relief & Comfort","e":"I can't abide rude people.","s":["tolerate","bear","brook","obey","comply"],"a":["reject","disobey","resist","flout","contravene"]},{"w":"abject","p":"adj","d":"Extremely bad or hopeless; without pride.","t":"negative","g":"State & Condition","e":"They lived in abject poverty.","s":["wretched","hopeless","miserable","base"],"a":["proud","dignified","noble"]},{"w":"abjure","p":"verb","d":"To formally renounce or give up.","t":"neutral","g":"Resolve & Change","e":"He abjured his former political beliefs.","s":["renounce","repudiate","relinquish","forswear"],"a":["espouse","embrace","affirm"]},{"w":"abound","p":"verb","d":"To exist in large numbers or amounts.","t":"neutral","g":"Wealth & Quantity","e":"Wildflowers abound in the meadow every spring.","s":["proliferate","teem","overflow"],"a":["dwindle","lack","wane"]},{"w":"abreast","p":"adj","d":"Up to date with the latest information.","t":"positive","g":"Intellect & Perception","e":"She keeps abreast of developments in her field.","s":["informed","current","up-to-date"],"a":["ignorant","outdated","behind"]},{"w":"abscond","p":"verb","d":"To flee secretly.","t":"negative","g":"Deception & Cunning","e":"The treasurer absconded with the club's funds.","s":["flee","escape","decamp","bolt"],"a":["remain","stay","return"]},{"w":"abstain","p":"verb","d":"To choose not to do or have something.","t":"neutral","g":"Resolve & Change","e":"She abstained from voting.","s":["refrain","forbear","decline","eschew"],"a":["indulge","partake"]},{"w":"abstract","p":"adj","d":"Theoretical; not concrete.","t":"neutral","g":"Intellect & Perception","e":"The lecture was too abstract for most students.","s":["theoretical","conceptual","notional","abstruse"],"a":["concrete","tangible","practical","empirical","treatise"]},{"w":"abstruse","p":"adj","d":"Difficult to understand; obscure.","t":"neutral","g":"Fairness & Judgment","e":"The paper's <script>
(function(){
  const state={q:"",tone:"all",group:"all",mode:"browse"};
  const grid=document.getElementById('grid');
  const fcWrap=document.getElementById('fcWrap');
  const empty=document.getElementById('empty');
  const foot=document.getElementById('foot');

  // ---- Flashcard session state ----
  const fc={deck:[],i:0,flipped:false,known:new Set(),unknown:new Set(),done:false};

  const c={positive:0,negative:0,neutral:0};
  DATA.forEach(w=>c[w.t]++);
  document.getElementById('counts').innerHTML=
    '<b>'+DATA.length+'</b> words · <span class="dot p"></span><b>'+c.positive+
    '</b> positive · <span class="dot n"></span><b>'+c.negative+
    '</b> negative · <span class="dot u"></span><b>'+c.neutral+'</b> neutral';

  // ---- Tone chips ----
  const tones=document.getElementById('tones');
  [["all","All tones",""],["positive","Positive","p"],["negative","Negative","n"],["neutral","Neutral","u"]]
  .forEach(([v,label,d])=>{
    const b=document.createElement('button');
    b.className='chip tone-'+v+(v==='all'?' on':'');
    b.dataset.tone=v;
    b.innerHTML=(d?'<span class="dot '+d+'"></span>':'')+label;
    b.onclick=()=>{
      state.tone=v;
      [...tones.children].forEach(x=>x.classList.toggle('on',x.dataset.tone===v));
      onFilterChange();
    };
    tones.appendChild(b);
  });

  // ---- Group chips ----
  const groups=document.getElementById('groups');
  const gcount={};DATA.forEach(w=>gcount[w.g]=(gcount[w.g]||0)+1);
  [["all","All themes"]].concat(Object.keys(gcount).sort().map(g=>[g,g])).forEach(([v,label])=>{
    const b=document.createElement('button');
    b.className='chip'+(v==='all'?' on':'');
    b.dataset.group=v;
    b.textContent=v==='all'?label:label+' ('+gcount[v]+')';
    b.onclick=()=>{
      state.group=v;
      [...groups.children].forEach(x=>x.classList.toggle('on',x.dataset.group===v));
      onFilterChange();
    };
    groups.appendChild(b);
  });

  document.getElementById('q').addEventListener('input',e=>{
    state.q=e.target.value.toLowerCase().trim();
    onFilterChange();
  });

  const mB=document.getElementById('mBrowse'),
        mF=document.getElementById('mFlip'),
        mC=document.getElementById('mCards');
  function setMode(m){
    state.mode=m;
    mB.classList.toggle('on',m==='browse');
    mF.classList.toggle('on',m==='flip');
    mC.classList.toggle('on',m==='cards');
    if(m==='cards') newSession();
    render();
  }
  mB.onclick=()=>setMode('browse');
  mF.onclick=()=>setMode('flip');
  mC.onclick=()=>setMode('cards');

  // Changing a filter while in flashcard mode rebuilds the deck
  function onFilterChange(){
    if(state.mode==='cards') newSession();
    render();
  }

  function esc(s){return String(s).replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));}

  function match(w){
    if(state.tone!=='all'&&w.t!==state.tone)return false;
    if(state.group!=='all'&&w.g!==state.group)return false;
    if(state.q){
      const hay=(w.w+' '+w.d+' '+w.s.join(' ')+' '+w.a.join(' ')).toLowerCase();
      if(!hay.includes(state.q))return false;
    }
    return true;
  }
  function filtered(){return DATA.filter(match);}

  // Fisher-Yates shuffle
  function shuffle(a){
    const r=a.slice();
    for(let i=r.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [r[i],r[j]]=[r[j],r[i]];
    }
    return r;
  }

  // ---------- FLASHCARD SESSION ----------
  function newSession(deck){
    fc.deck = deck || shuffle(filtered());
    fc.i=0; fc.flipped=false; fc.done=false;
    fc.known=new Set(); fc.unknown=new Set();
  }
  function reshuffle(){
    // keep progress markers, just reorder remaining
    fc.deck=shuffle(fc.deck);
    fc.i=0; fc.flipped=false; fc.done=false;
    renderCards();
  }
  function grade(knew){
    const w=fc.deck[fc.i];
    if(!w)return;
    if(knew){ fc.known.add(w.w); fc.unknown.delete(w.w); }
    else { fc.unknown.add(w.w); fc.known.delete(w.w); }
    next();
  }
  function next(){
    if(fc.i < fc.deck.length-1){ fc.i++; fc.flipped=false; }
    else { fc.done=true; }
    renderCards();
  }
  function prev(){
    if(fc.i>0){ fc.i--; fc.flipped=false; fc.done=false; renderCards(); }
  }

  function cardBackHTML(w){
    const syn=w.s.length?'<div class="synrow"><span class="lbl">Synonyms</span><div class="tags">'+
      w.s.map(s=>'<span class="tag">'+esc(s)+'</span>').join('')+'</div></div>':'';
    const ant=w.a.length?'<div class="synrow"><span class="lbl">Antonyms</span><div class="tags">'+
      w.a.map(s=>'<span class="tag ant">'+esc(s)+'</span>').join('')+'</div></div>':'';
    return '<div class="fc-head"><span class="fc-word">'+esc(w.w)+'</span>'+
      '<span class="tone-tag '+w.t+'">'+w.t+'</span></div>'+
      '<div class="def" style="margin-top:12px">'+esc(w.d)+'</div>'+
      '<div class="ex">"'+esc(w.e)+'"</div>'+ syn + ant +
      '<div class="grp">▸ '+esc(w.g)+'</div>';
  }

  function renderCards(){
    const total=fc.deck.length;
    if(!total){
      fcWrap.innerHTML='';
      empty.style.display='block';
      foot.textContent='';
      return;
    }
    empty.style.display='none';

    // Session finished screen
    if(fc.done){
      const k=fc.known.size, u=fc.unknown.size;
      const pct = (k+u) ? Math.round(k/(k+u)*100) : 0;
      fcWrap.innerHTML =
        '<div class="fc-done">'+
          '<h2>Session complete</h2>'+
          '<p>You went through '+total+' card'+(total===1?'':'s')+'.</p>'+
          '<div class="stat">'+pct+'%</div>'+
          '<p><b style="color:var(--pos)">'+k+' known</b> · <b style="color:var(--neg)">'+u+' to review</b></p>'+
          '<div class="btns">'+
            '<button id="againAll">Shuffle &amp; restart</button>'+
            '<button class="alt" id="againMissed"'+(u?'':' disabled')+'>Drill the '+u+' missed</button>'+
          '</div>'+
        '</div>';
      document.getElementById('againAll').onclick=()=>{ newSession(); renderCards(); };
      const am=document.getElementById('againMissed');
      if(u) am.onclick=()=>{
        const missed=DATA.filter(w=>fc.unknown.has(w.w));
        newSession(shuffle(missed));
        renderCards();
      };
      foot.textContent='Session finished — '+k+'/'+(k+u)+' known';
      return;
    }

    const w=fc.deck[fc.i];
    const pctBar=Math.round((fc.i)/total*100);

    fcWrap.innerHTML =
      '<div class="fc-bar">'+
        '<span class="fc-count">'+(fc.i+1)+' / '+total+'</span>'+
        '<div class="fc-progress"><i style="width:'+pctBar+'%"></i></div>'+
        '<button class="fc-shuffle" id="shuf">'+
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'+
          'Shuffle</button>'+
      '</div>'+
      '<div class="fc-scores">'+
        '<span class="know">✓ '+fc.known.size+' known</span>'+
        '<span class="dunno">↻ '+fc.unknown.size+' review</span>'+
      '</div>'+
      '<div class="fc-card '+w.t+(fc.flipped?' flipped':'')+'" id="fcCard">'+
        '<div class="fc-inner">'+
          '<div class="fc-face fc-front">'+
            '<span class="fc-word">'+esc(w.w)+'</span>'+
            '<span class="fc-pos">'+esc(w.p)+'</span>'+
            '<span class="fc-hint">tap to reveal</span>'+
          '</div>'+
          '<div class="fc-face fc-back">'+cardBackHTML(w)+'</div>'+
        '</div>'+
      '</div>'+
      (fc.flipped
        ? '<div class="fc-actions">'+
            '<button class="again" id="bAgain">Need review</button>'+
            '<button class="got" id="bGot">I knew it</button>'+
          '</div>'
        : '')+
      '<div class="fc-nav">'+
        '<button id="bPrev"'+(fc.i===0?' disabled':'')+'>← Previous</button>'+
        '<button id="bSkip">Skip →</button>'+
      '</div>';

    document.getElementById('fcCard').onclick=()=>{ fc.flipped=!fc.flipped; renderCards(); };
    document.getElementById('shuf').onclick=(e)=>{ e.stopPropagation(); reshuffle(); };
    document.getElementById('bPrev').onclick=prev;
    document.getElementById('bSkip').onclick=next;
    if(fc.flipped){
      document.getElementById('bAgain').onclick=(e)=>{e.stopPropagation();grade(false);};
      document.getElementById('bGot').onclick=(e)=>{e.stopPropagation();grade(true);};
    }
    foot.textContent='Flashcards — '+total+' card'+(total===1?'':'s')+' in this deck';
  }

  // ---------- GRID MODES ----------
  function browseCard(w){
    const syn=w.s.length?'<div class="synrow"><span class="lbl">Synonyms</span><div class="tags">'+
      w.s.map(s=>'<span class="tag">'+esc(s)+'</span>').join('')+'</div></div>':'';
    const ant=w.a.length?'<div class="synrow"><span class="lbl">Antonyms</span><div class="tags">'+
      w.a.map(s=>'<span class="tag ant">'+esc(s)+'</span>').join('')+'</div></div>':'';
    return '<div class="card '+w.t+'"><div class="card-in">'+
      '<div class="card-top"><div><span class="word">'+esc(w.w)+'</span> <span class="pos">'+esc(w.p)+'</span></div>'+
      '<span class="tone-tag '+w.t+'">'+w.t+'</span></div>'+
      '<div class="def">'+esc(w.d)+'</div>'+
      '<div class="ex">"'+esc(w.e)+'"</div>'+ syn + ant +
      '<div class="grp">▸ '+esc(w.g)+'</div>'+
      '</div></div>';
  }
  function flipTile(w){
    const syn=w.s.length?'<div class="synrow"><span class="lbl">Synonyms</span><div class="tags">'+
      w.s.slice(0,5).map(s=>'<span class="tag">'+esc(s)+'</span>').join('')+'</div></div>':'';
    const ant=w.a.length?'<div class="synrow"><span class="lbl">Antonyms</span><div class="tags">'+
      w.a.slice(0,4).map(s=>'<span class="tag ant">'+esc(s)+'</span>').join('')+'</div></div>':'';
    return '<div class="card '+w.t+'"><div class="flip-inner">'+
      '<div class="face front"><span class="word">'+esc(w.w)+'</span><span class="pos">'+esc(w.p)+'</span><span class="hint">tap to reveal</span></div>'+
      '<div class="face back"><div class="card-in" style="padding:15px">'+
        '<span class="tone-tag '+w.t+'">'+w.t+'</span>'+
        '<div class="def" style="margin-top:8px">'+esc(w.d)+'</div>'+ syn + ant +
      '</div></div>'+
    '</div></div>';
  }

  function render(){
    const cards = state.mode==='cards';
    grid.style.display = cards ? 'none' : 'grid';
    fcWrap.style.display = cards ? 'block' : 'none';

    if(cards){ renderCards(); return; }

    const list=filtered();
    grid.classList.toggle('flip',state.mode==='flip');
    if(!list.length){
      grid.innerHTML='';empty.style.display='block';foot.textContent='';return;
    }
    empty.style.display='none';
    grid.innerHTML=list.map(w=>state.mode==='flip'?flipTile(w):browseCard(w)).join('');
    if(state.mode==='flip'){
      grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>c.classList.toggle('flipped'));
    }
    foot.textContent='Showing '+list.length+' of '+DATA.length+' words';
  }

  // Keyboard shortcuts in flashcard mode
  document.addEventListener('keydown',e=>{
    if(state.mode!=='cards'||fc.done)return;
    if(document.activeElement.tagName==='INPUT')return;
    if(e.code==='Space'){e.preventDefault();fc.flipped=!fc.flipped;renderCards();}
    else if(e.code==='ArrowRight'){e.preventDefault();next();}
    else if(e.code==='ArrowLeft'){e.preventDefault();prev();}
    else if(fc.flipped&&(e.key==='1'||e.key==='j')){grade(false);}
    else if(fc.flipped&&(e.key==='2'||e.key==='k')){grade(true);}
  });

  render();
})();
</script>
</body>
</html>
